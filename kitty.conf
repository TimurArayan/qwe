# ======================================================================
# KITTY — готовый редактируемый конфиг
# Файл: ~/.config/kitty/kitty.conf
# Строки, начинающиеся с #, — комментарии.
# Чтобы отключить настройку, поставь # в начале строки.
# ======================================================================

# ----------------------------------------------------------------------
# 1. ШРИФТЫ
# ----------------------------------------------------------------------
font_family            Comic True Mono
bold_font              true
italic_font            auto
bold_italic_font       auto
font_size               17
# Если установлен JetBrains Mono, можешь заменить первую строку на:
# font_family           JetBrains Mono
# Другой вариант:       kitten choose-fonts
# never = лигатуры разрешены; always = лигатуры отключены
# disable_ligatures     never

# ----------------------------------------------------------------------
# 2. ЦВЕТА — тёмная палитра, похожая на Catppuccin Mocha
# ----------------------------------------------------------------------
foreground             #ffffff
background             #101219
selection_foreground   #ff5588
selection_background   #d4e896

# 16 цветов терминала (ANSI)
color0                 #45475a
color1                 #f38ba8
color2                 #a6e3a1
color3                 #f9e2af
color4                 #89b4fa
color5                 #f5c2e7
color6                 #94e2d5
color7                 #bac2de
color8                 #585b70
color9                 #f38ba8
color10                #a6e3a1
color11                #f9e2af
color12                #89b4fa
color13                #f5c2e7
color14                #94e2d5
color15                #a6adc8

# ----------------------------------------------------------------------
# 3. ПРОЗРАЧНОСТЬ
# ----------------------------------------------------------------------
# 1.0 = непрозрачный, 0.9 = слегка прозрачный
background_opacity     1
# Работает при поддержке ОС/композитора
background_blur        0
# Позволяет менять прозрачность горячими клавишами/командами
dynamic_background_opacity no

# ----------------------------------------------------------------------
# 4. КУРСОР
# ----------------------------------------------------------------------
cursor                 #ffffff
cursor_text_color      #1e1e2e
# beam = вертикальная черта, block = блок, underline = подчёркивание
cursor_shape           beam
cursor_shape_unfocused hollow
cursor_beam_thickness 1.25
cursor_blink_interval  0.5
cursor_stop_blinking_after 3600

# ----------------------------------------------------------------------
# 5. ОКНА, РАЗДЕЛЕНИЕ ЭКРАНА, ОТСТУПЫ
# ----------------------------------------------------------------------
remember_window_size   yes
initial_window_width   1920
initial_window_height  650
window_padding_width   0
window_margin_width    0
window_border_width    0
draw_minimal_borders   yes
active_border_color    #ffffff
inactive_border_color  #45475a
# yes = скрыть заголовок/рамку ОС, no = обычное окно
hide_window_decorations no
# Первый режим — начальный. splits нужен для hsplit/vsplit.
#enabled_layouts         splits,tall,grid,stack

# ----------------------------------------------------------------------
# 6. ВКЛАДКИ
# ----------------------------------------------------------------------
tab_bar_edge           top
# Варианты: fade, slant, separator, powerline, hidden
tab_bar_style          separator
tab_powerline_style    
tab_bar_min_tabs       2
tab_title_template     "{title:^11}"
tab_title_max_length   11
active_tab_foreground   #000000
active_tab_background    #bd2d5e
active_tab_font_style  normal
inactive_tab_foreground  #ed2467
inactive_tab_background  #151419
inactive_tab_font_style normal
tab_bar_background       #151419
tab_separator ""
tab_bar_align left
# Без дополнительных отступов панели
tab_bar_margin_height 0.0 0.0




# ----------------------------------------------------------------------
# 7. МЫШЬ, КОПИРОВАНИЕ И ССЫЛКИ
# ----------------------------------------------------------------------
mouse_hide_wait        1
focus_follows_mouse    no
# clipboard = копировать выделенное мышью сразу; no = вручную
copy_on_select         no
strip_trailing_spaces  smart
url_color              #89b4fa
url_style              curly
open_url_with          default

# ----------------------------------------------------------------------
# 8. ИСТОРИЯ И ОПОВЕЩЕНИЯ
# ----------------------------------------------------------------------
scrollback_lines       10000
enable_audio_bell      no
visual_bell_duration   0.0

# ----------------------------------------------------------------------
# 9. SHELL / ПОВЕДЕНИЕ
# ----------------------------------------------------------------------
# Использовать системную оболочку (bash, zsh, fish и т. д.)
# shell                 .
shell_integration      enabled
# Не разрешать внешним процессам удалённо управлять Kitty
allow_remote_control   no
# Оставить стандартное подтверждение закрытия окна
confirm_os_window_close -1
# Не закрывать окно автоматически при завершении дочернего процесса
close_on_child_death   no
# Перезагружать доступные настройки при сохранении файла
auto_reload_config     0.1

# ----------------------------------------------------------------------
# 10. ГОРЯЧИЕ КЛАВИШИ (Linux; kitty_mod = Ctrl+Shift)
# ----------------------------------------------------------------------
kitty_mod              ctrl

# Вкладки и окна
map kitty_mod+tab      new_tab
map kitty_mod+q        close_tab
#map kitty_mod+enter    new_window
map kitty_mod+n        new_os_window
#map kitty_mod+w        close_window
map kitty_mod+right    next_tab
map kitty_mod+left     previous_tab
#map kitty_mod+]        next_window
#map kitty_mod+[        previous_window

# Разделение текущего окна — для режима splits
# Ctrl+Shift+Alt+V: разделить на колонки
#map kitty_mod+alt+v    launch --location=vsplit
# Ctrl+Shift+Alt+H: разделить на строки
#map kitty_mod+alt+h    launch --location=hsplit
# Ctrl+Shift+Alt+R: повернуть разделение
#map kitty_mod+alt+r    layout_action rotate

# Перемещение фокуса между разделёнными окнами
#map kitty_mod+alt+left  neighboring_window left
#map kitty_mod+alt+right neighboring_window right
#map kitty_mod+alt+up    neighboring_window up
#map kitty_mod+alt+down  neighboring_window down

# Режимы расположения окон
#map kitty_mod+l        next_layout
#map kitty_mod+z        toggle_layout stack

# Копирование и вставка
map ctrl+c        copy_to_clipboard
map ctrl+v        paste_from_clipboard

# Остановка процесса (SIGINT)
map ctrl+shift+c send_text all \x03

# Масштаб текста
map kitty_mod+equal    change_font_size all +1.0
map kitty_mod+minus    change_font_size all -1.0
map kitty_mod+backspace change_font_size all 0

# Открыть конфиг, перезагрузить конфиг, посмотреть ошибки
map kitty_mod+f2       edit_config_file
map kitty_mod+f5       load_config_file
map kitty_mod+f6       debug_config

# Переход по вкладкам (Ctrl+Alt+число)
map ctrl+1         goto_tab 1
map ctrl+2         goto_tab 2
map ctrl+3         goto_tab 3
map ctrl+4         goto_tab 4
map ctrl+5         goto_tab 5

# ----------------------------------------------------------------------
# 11. ПРИМЕРЫ НЕОБЯЗАТЕЛЬНЫХ НАСТРОЕК
# Раскомментируй нужную строку, чтобы включить её.
# ----------------------------------------------------------------------
# font_size               15.0
# background_opacity      1.0
# background_blur         20
# cursor_shape            block
# copy_on_select          clipboard
# hide_window_decorations yes
# tab_bar_edge            top
# tab_bar_style           slant
# notify_on_cmd_finish    unfocused 15
modify_font cell_height 14px
modify_font baseline 0px

enabled_layouts splits
