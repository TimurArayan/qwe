[colors]
background = #151419
foreground = #ed2467
workspace-selected = #bd2d5e
workspace-selected-text = #000000


[bar/main]
width = 100%
height = 40
bottom = true
enable-ipc = true

background = ${colors.background}
foreground = ${colors.foreground}

font-0 = Calibri:style=Bold:size=16;2
font-1 = CopyBoard Menu Icon:pixelsize=24;5
font-2 = Calibri:style=Bold:size=15;2
font-3 = Calibri:style=Bold:size=16;0

modules-left = workspace-apps


modules-right = typing-speed volume keyboard clock rofi-placeholder


[module/rofi-placeholder]
type = custom/text
label = 
label-font = 2
label-foreground = #ed2467
label-padding = 8px
click-left = rofi -config ~/.config/rofi/menu.rasi -show drun

[module/clock]
label-font = 3
type = internal/date
interval = 1
time = %H:%M:%S
label = %time%
label-padding = 8px


[module/keyboard]
label-layout-font = 4
type = internal/xkeyboard

format = <label-layout>

layout-icon-0 = us;eng
layout-icon-1 = ru;ru
layout-icon-default = ?

label-layout = %icon%
label-layout-padding = 8px

[module/volume]
type = internal/pulseaudio
use-ui-max = false
label-volume-padding = 8px
label-muted-padding = 8px

format-volume = <label-volume>
label-volume = %percentage%%

format-muted = <label-muted>
label-muted = mut







[module/workspaces]
label-font = 1
type = internal/i3

label-focused = %name%
label-focused-background = #ffffff
label-focused-foreground = #000000
label-focused-underline = #bb88dd
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = #aaaaaa
label-unfocused-padding = 2
label-unfocused-background = #222222



[module/workspace-apps]
type = custom/script
exec = python /media/sf_CopyBoard/polybar_workspaces.py --from-config
tail = true


[module/typing-speed]
type = custom/script
exec = python -u /media/sf_CopyBoard/polybar_typing_speed.py
tail = true
label = %output%
label-padding = 8px